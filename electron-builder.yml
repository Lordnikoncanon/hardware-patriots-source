appId: com.hardwarepatriots.spoolshelf
productName: Hardware Patriots
publish: null
copyright: Copyright © 2026 Hardware Patriots
asar: true
artifactName: Hardware-Patriots-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: assets
files:
  - electron/**/*
  - out/**/*
  - package.json
extraMetadata:
  main: electron/main.cjs
linux:
  target:
    - AppImage
    - deb
  category: Office
  maintainer: Hardware Patriots <support@hardwarepatriots.local>
  synopsis: Filament inventory for Bambu and Prusa printers.
  executableName: hardware-patriots
win:
  target:
    - zip
  signAndEditExecutable: false
mac:
  target:
    - zip
    - dmg
  category: public.app-category.business
  identity: null
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  shortcutName: Hardware Patriots
  artifactName: Hardware-Patriots-Setup-${version}-win-${arch}.${ext}
dmg:
  artifactName: Hardware-Patriots-${version}-mac-${arch}.${ext}
