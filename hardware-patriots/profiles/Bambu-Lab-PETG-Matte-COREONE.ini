# generated by PrusaSlicer 2.9.6+linux64
# Import with File > Import > Import Config.
# Requires the Prusa Research system profiles shipped with PrusaSlicer 2.9.6.

[filament:Bambu Lab PETG Matte @COREONE HF0.4]
inherits = Generic PETG @COREONE HF0.4
filament_vendor = Bambu Lab
filament_type = PETG
first_layer_temperature = 245
temperature = 250
first_layer_bed_temperature = 85
bed_temperature = 85
filament_max_volumetric_speed = 15
filament_density = 1.37
filament_colour = #B4B4B4
filament_notes = "Bambu Lab PETG Matte on Prusa CORE One / CORE One+ (Gen2), 0.4 mm high-flow nozzle. Nozzle 245 C first layer, 250 C other layers. Max volumetric speed 15 mm3/s. These match Bambu Studio's PETG Matte 0.4 mm profile (X1C and P1S). Bed stays at 85 C from the Prusa CORE One PETG profile so it holds on the Prusa sheet. Fan, retraction, pressure advance and chamber stay on that CORE One profile. Dry the spool at 65 C for 12 h if it strings. Bambu Studio uses a 0.95 flow ratio; this preset keeps Prusa's 1.00 extrusion multiplier. Measure a single-wall cube and lower the multiplier if walls come out wide."
compatible_printers_condition = printer_model=~/(COREONE|COREONEOAK|COREONEMMU3|COREONEL|COREONELMMU3)/ and nozzle_diameter[0]!=0.8 and nozzle_diameter[0]!=0.6 and nozzle_diameter[0]!=0.5 and nozzle_high_flow[0]

[print:0.20mm Camera Mount @COREONE HF0.4]
inherits = 0.20mm BALANCED @COREONE HF0.4
perimeters = 4
fill_density = 30%
fill_pattern = gyroid
bottom_solid_layers = 4
support_material = 0
avoid_crossing_perimeters = 1
compatible_printers_condition = printer_model=~/(COREONE|COREONEOAK|COREONEMMU3)/ and nozzle_diameter[0]==0.4 and nozzle_high_flow[0]
