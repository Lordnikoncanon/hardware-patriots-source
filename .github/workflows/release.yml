name: Release installers

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            build: npx electron-builder --win nsis --x64 -c.win.signAndEditExecutable=true
          - os: macos-latest
            label: Mac
            build: npx electron-builder --mac --arm64 --x64
          - os: ubuntu-latest
            label: Linux
            build: npx electron-builder --linux AppImage deb --x64
    steps:
      - uses: actions/checkout@v4
      - name: Locate the app
        id: app
        shell: bash
        run: |
          lock=$(find . -name package-lock.json -not -path '*/node_modules/*' | head -1)
          if [ -z "$lock" ]; then
            echo "package-lock.json is not in the repository."
            find . -maxdepth 3 -type f \( -name package.json -o -name package-lock.json \)
            exit 1
          fi
          dir=$(dirname "$lock")
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "App is in $dir"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ steps.app.outputs.dir }}/package-lock.json
      - run: npm ci
        working-directory: ${{ steps.app.outputs.dir }}
      - run: npm run build
        working-directory: ${{ steps.app.outputs.dir }}
      - run: ${{ matrix.build }}
        working-directory: ${{ steps.app.outputs.dir }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Collect installers
        shell: bash
        working-directory: ${{ steps.app.outputs.dir }}
        run: |
          shopt -s nullglob
          mkdir -p "$GITHUB_WORKSPACE/dist-installers"
          files=(release/*.exe release/*.dmg release/*.zip release/*.AppImage release/*.deb)
          if [ ${#files[@]} -eq 0 ]; then
            echo "The build finished without an installer."
            ls -la release || true
            exit 1
          fi
          cp -v "${files[@]}" "$GITHUB_WORKSPACE/dist-installers/"
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.label }}
          if-no-files-found: error
          path: dist-installers/*

  release:
    name: Publish to GitHub
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: installers-*
          merge-multiple: true
      - name: Read the version
        id: version
        shell: bash
        run: |
          lock=$(find . -name package-lock.json -not -path '*/node_modules/*' | head -1)
          dir=$(dirname "$lock")
          version=$(node -p "require('$dir/package.json').version")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Hardware Patriots ${{ steps.version.outputs.tag }}
          generate_release_notes: false
          files: dist/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
